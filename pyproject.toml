[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vititrack"
version = "0.0.1"
description = "Open, agent-driven longitudinal monitoring for early-stage vitiligo"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["vititrack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
